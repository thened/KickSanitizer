<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="#0f0f0f"/>

  <!-- Broom, angled ~-40°, centered in the icon -->
  <g transform="translate(62,60) rotate(-40)">
    <!-- Handle -->
    <rect x="-6" y="-52" width="12" height="72" rx="6" fill="#53fc18"/>
    <!-- Collar band -->
    <rect x="-9" y="18" width="18" height="7" rx="3.5" fill="#2e9910"/>
    <!-- Bristle fan -->
    <path d="M-28 25 Q-30 56 -34 60 L34 60 Q30 56 28 25 Z" fill="#53fc18"/>
    <!-- Bristle separation lines -->
    <line x1="-24" y1="25" x2="-28" y2="60" stroke="#2e9910" stroke-width="2.2"/>
    <line x1="-11" y1="25" x2="-13" y2="60" stroke="#2e9910" stroke-width="2.2"/>
    <line x1="2"   y1="25" x2="2"   y2="60" stroke="#2e9910" stroke-width="2.2"/>
    <line x1="15"  y1="25" x2="17"  y2="60" stroke="#2e9910" stroke-width="2.2"/>
    <line x1="26"  y1="25" x2="30"  y2="60" stroke="#2e9910" stroke-width="2.2"/>
  </g>

  <!-- 4-point sparkle (large, upper-right of broom head) -->
  <path d="M97 26 L99.5 19 L102 26 L109 28.5 L102 31 L99.5 38 L97 31 L90 28.5 Z" fill="white"/>
  <!-- Small sparkle -->
  <path d="M108 44 L109.5 40 L111 44 L115 45.5 L111 47 L109.5 51 L108 47 L104 45.5 Z" fill="white" opacity="0.85"/>
  <!-- Tiny dot -->
  <circle cx="94" cy="43" r="2.5" fill="white" opacity="0.7"/>
</svg>
